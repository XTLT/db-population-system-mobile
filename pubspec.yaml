name: population_mobile
description: 人口通移动端

publish_to: 'none'

version: 0.0.19+19

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 网络请求
  dio: ^5.7.0
  
  # 状态管理
  provider: ^6.1.2
  
  # 本地存储
  shared_preferences: ^2.3.3
  
  # 安全存储（用于Token等敏感数据）
  flutter_secure_storage: ^9.2.2
  
  # 图片选择
  image_picker: ^1.1.2
  
  # 图片缓存
  cached_network_image: ^3.4.1
  
  # 下拉刷新
  pull_to_refresh: ^2.0.0
  
  # 图表
  fl_chart: ^0.69.0
  
  # 国际化
  intl: ^0.19.0
  
  # 权限管理
  permission_handler: ^11.3.1
  
  # 通知
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0

  # Excel 处理
  excel: ^4.0.0
  file_picker: ^10.0.0
  path_provider: ^2.1.0
  
  # PDF 导出
  pdf: ^3.10.0
  printing: ^5.11.0
  
  # 分享
  share_plus: ^10.0.0

  # 网络连接检测
  connectivity_plus: ^6.0.0
  
  # 加密库（用于密码哈希等）
  crypto: ^3.0.3

  # 应用信息
  package_info_plus: ^8.0.0
  
  # URL打开
  url_launcher: ^6.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/certs/
