name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  flutter-check:
    name: Flutter 分析 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 获取依赖
        run: flutter pub get
      - name: 静态分析
        run: flutter analyze
      - name: 运行测试
        run: flutter test
